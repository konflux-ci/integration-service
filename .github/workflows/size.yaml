name: Pull request size
on: pull_request_target

jobs:
  size-label:
    name: Size label
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Calculate size
        run: |
          #!/usr/bin/bash
          set -euo pipefail

          response=$(curl -sS \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}")

          additions=$(jq -r '.additions // 0' <<< "$response" 2>/dev/null || echo 0)
          deletions=$(jq -r '.deletions // 0' <<< "$response" 2>/dev/null || echo 0)

          [[ "$additions" =~ ^[0-9]+$ ]] || additions=0
          [[ "$deletions" =~ ^[0-9]+$ ]] || deletions=0

          size=$((additions + deletions))

          sizelabel=XS
          if [ "${size}" -gt 600 ]; then
            sizelabel="XXL"
          elif [ "${size}" -gt 240 ]; then
            sizelabel="XL"
          elif [ "${size}" -gt 120 ]; then
            sizelabel="L"
          elif [ "${size}" -gt 60 ]; then
            sizelabel="M"
          elif [ "${size}" -gt 35 ]; then
            sizelabel="S"
          fi

          echo "Adding size: ${sizelabel}"
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" \
            -d "[\"size: ${sizelabel}\"]"
