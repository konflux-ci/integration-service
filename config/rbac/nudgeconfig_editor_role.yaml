# This rule is not used by the project integration-service itself.
# It is provided to allow the cluster admin to help manage permissions
# for users.
#
# Grants permissions to create, update, and delete NudgeConfig
# resources within the konflux-ci.dev. This role is intended for
# users who need to manage these resources but should not control RBAC
# or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: integration-service
    app.kubernetes.io/managed-by: kustomize
  name: nudgeconfig-editor-role
rules:
- apiGroups:
  - konflux-ci.dev
  resources:
  - nudgeconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - konflux-ci.dev
  resources:
  - nudgeconfigs/status
  verbs:
  - get
