codecov:
  require_ci_to_pass: false
ignore:
- api/**/zz_generated.deepcopy.go
- gitops/integrationteststatus_enumer.go
- status/mock_reporter.go
- status/mock_status.go
- e2e-tests/**
- vendor/**
- .agents/**
- .claude/**
- .cursor/**
- skills/**
- docs/**
- '*.md'
- '*.toml'
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 85%
        # Patch coverage below 85% will block the PR.
        informational: false
comment:
  layout: reach,diff,flags,files,footer
  require_changes: true
