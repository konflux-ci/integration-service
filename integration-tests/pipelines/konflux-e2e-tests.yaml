---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: konflux-e2e-tests
spec:
  description: |-
    This pipeline automates the process of running end-to-end tests for Konflux
    using a Kind cluster running on AWS cluster. The pipeline provisions
    the Kind cluster, installs Konflux using the konflux-ci repository scripts, runs the tests, collects artifacts,
    and finally deprovisions the Kind cluster.
  params:
    - name: SNAPSHOT
      description: 'The JSON string representing the snapshot of the application under test.'
      default: '{"components": [{"name":"test-app", "containerImage": "quay.io/example/repo:latest"}]}'
      type: string
    - name: test-name
      description: 'The name of the test corresponding to a defined Konflux integration test.'
      default: ''
    - name: ocp-version
      description: 'Unused — kept for ITS compatibility, pending ITS cleanup.'
      default: ''
      type: string
    - name: replicas
      description: 'Unused — kept for ITS compatibility, pending ITS cleanup.'
      default: ''
      type: string
    - name: machine-type
      description: 'Unused — kept for ITS compatibility, pending ITS cleanup.'
      default: ''
      type: string
    - name: konflux-test-infra-secret
      description: The name of secret where testing infrastructures credentials are stored.
      type: string
    - name: oci-container-repo
      default: 'quay.io/konflux-test-storage/konflux-team/integration-service'
      description: The OCI container used to store all test artifacts.
    - name: artifact-browser-url
      description: "URL to the artifact browser deployment. If provided, a link will be added to PR comments."
      default: ""
      type: string
  tasks:
    - name: test-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/test-metadata/0.4/test-metadata.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: test-name
          value: $(context.pipelineRun.name)
    - name: provision-kind-cluster
      runAfter:
        - test-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/mapt-oci/kind-aws-spot/provision/0.2/kind-aws-provision.yaml
      params:
        - name: secret-aws-credentials
          value: mapt-kind-secret
        - name: cluster-access-secret-name
          value: kfg-$(context.pipelineRun.name)
        - name: id
          value: $(context.pipelineRun.name)
        - name: tags
          value: 'owner=konflux-devprod@redhat.com,project=Konflux,created-by=integration-pipeline,component=integration-service'
        - name: debug
          value: 'false'
        - name: ownerKind
          value: PipelineRun
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: oci-ref
          value: $(params.oci-container-repo):$(context.pipelineRun.name)
        - name: credentials-secret-name
          value: $(params.konflux-test-infra-secret)
        - name: extra-port-mappings
          value: >-
            '[{\"containerPort\":30012,\"hostPort\":8180,\"protocol\":\"TCP\"}]'
        - name: cpus
          value: "32"
        - name: memory
          value: "64"
        - name: spot
          value: "false"
        - name: harden-control-plane
          value: "true"
    - name: deploy-konflux
      runAfter:
        - provision-kind-cluster
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/konflux-ci
          - name: revision
            value: 8a3219a261dca651737a0890c3868c7363af2877
          - name: pathInRepo
            value: .tekton/tasks/deploy-konflux/task.yaml
      params:
        - name: cluster-access-secret
          value: kfg-$(context.pipelineRun.name)
        - name: overrides-yaml
          value: |
            - name: integration-service
              git:
                - sourceRepo: konflux-ci/integration-service
                  remote:
                    repo: $(tasks.test-metadata.results.git-url)
                    ref: $(tasks.test-metadata.results.git-revision)
              images:
                - orig: quay.io/konflux-ci/integration-service
                  replacement: $(tasks.test-metadata.results.instrumented-container-repo):$(tasks.test-metadata.results.instrumented-container-tag)
        - name: konflux-ready-timeout
          value: "30m"
        - name: oci-container-repo
          value: $(params.oci-container-repo)
        - name: oci-container-repo-credentials-secret
          value: $(params.konflux-test-infra-secret)
        - name: pipeline-run-name
          value: $(context.pipelineRun.name)
        - name: git-url
          value: https://github.com/konflux-ci/konflux-ci
        - name: revision
          value: main
    - name: configure-pac-webhook-url
      runAfter:
        - deploy-konflux
      params:
        - name: cluster-access-secret-name
          value: kfg-$(context.pipelineRun.name)
      taskSpec:
        params:
          - name: cluster-access-secret-name
            type: string
        volumes:
          - name: konflux-ci-secrets
            secret:
              secretName: konflux-e2e-secrets
          - name: cluster-kubeconfig
            secret:
              secretName: $(params.cluster-access-secret-name)
        steps:
          - name: set-pac-webhook-url
            image: quay.io/openshift/origin-cli:4.16
            volumeMounts:
              - name: konflux-ci-secrets
                mountPath: /usr/local/konflux-ci-secrets
              - name: cluster-kubeconfig
                mountPath: /tmp/kubeconfig
                subPath: kubeconfig
            env:
              - name: KUBECONFIG
                value: /tmp/kubeconfig
            script: |
              #!/bin/bash
              set -euo pipefail
              SMEE_CHANNEL=$(cat /usr/local/konflux-ci-secrets/smee-channel)
              # build-service reads PAC_WEBHOOK_URL to determine the webhook URL it
              # registers with external git providers (GitLab, Forgejo, etc.).
              # Without this, it falls back to the internal service URL which is
              # unreachable from the internet, so no webhook events are ever delivered.
              oc --request-timeout=30s -n build-service set env \
                deployment/build-service-controller-manager \
                PAC_WEBHOOK_URL="${SMEE_CHANNEL}"
              oc --request-timeout=30s -n build-service rollout status \
                deployment/build-service-controller-manager \
                --timeout=300s
              echo "build-service ready with PAC_WEBHOOK_URL configured"

              echo "Waiting for dex to be ready..."
              oc --request-timeout=30s -n konflux-ui rollout status \
                deployment/dex \
                --timeout=120s
              echo "dex ready"

              echo "Waiting for integration-service to be ready..."
              oc --request-timeout=30s -n integration-service rollout status \
                deployment/integration-service-controller-manager \
                --timeout=120s
              echo "integration-service ready"
    - name: konflux-e2e-tests
      timeout: 2h30m
      runAfter:
        - configure-pac-webhook-url
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-service.git
          - name: revision
            value: main
          - name: pathInRepo
            value: integration-tests/tasks/konflux-e2e-tests/0.1/konflux-e2e-tests.yaml
      params:
        - name: test-name
          value: $(context.pipelineRun.name)
        - name: git-repo
          value: $(tasks.test-metadata.results.git-repo)
        - name: git-url
          value: $(tasks.test-metadata.results.git-url)
        - name: git-revision
          value: $(tasks.test-metadata.results.git-revision)
        - name: oras-container
          value: $(params.oci-container-repo):$(context.pipelineRun.name)
        - name: job-spec
          value: $(tasks.test-metadata.results.job-spec)
        - name: component-image
          value: $(tasks.test-metadata.results.container-image)
        - name: cluster-access-secret-name
          value: kfg-$(context.pipelineRun.name)
        - name: test-environment
          value: "upstream"
  finally:
    - name: collect-and-upload-coverage
      params:
        - name: instrumented-images
          value: "$(tasks.test-metadata.results.instrumented-container-repo):$(tasks.test-metadata.results.instrumented-container-tag)"
        - name: cluster-access-secret-name
          value: kfg-$(context.pipelineRun.name)
        - name: test-name
          value: e2e-tests
        - name: oci-container
          value: "$(params.oci-container-repo):$(context.pipelineRun.name)-coverport"
        - name: codecov-flags
          value: e2e-tests
        - name: credentials-secret-name
          value: "integration-service-coverport-secrets"
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/coverport-coverage/0.1/coverport-coverage.yaml
      when:
        - input: $(tasks.konflux-e2e-tests.status)
          operator: in
          values:
            - Succeeded
            - Failed
    - name: store-pipeline-status
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/store-pipeline-status/0.1/store-pipeline-status.yaml
      params:
        - name: oci-ref
          value: "$(params.oci-container-repo):$(context.pipelineRun.name)"
        - name: credentials-secret-name
          value: "$(params.konflux-test-infra-secret)"
        - name: pipelinerun-name
          value: $(context.pipelineRun.name)
        - name: pipeline-aggregate-status
          value: $(tasks.status)
    - name: deprovision-kind-cluster
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/mapt-oci/kind-aws-spot/deprovision/0.1/kind-aws-deprovision.yaml
      params:
        - name: secret-aws-credentials
          value: mapt-kind-secret
        - name: id
          value: $(context.pipelineRun.name)
        - name: cluster-access-secret
          value: kfg-$(context.pipelineRun.name)
        - name: oci-container
          value: $(params.oci-container-repo):$(context.pipelineRun.name)
        - name: oci-credentials
          value: konflux-test-infra
    - name: pull-request-status-message
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/pull-request-comment/0.1/pull-request-comment.yaml
      params:
        - name: test-name
          value: $(context.pipelineRun.name)
        - name: oci-container
          value: $(params.oci-container-repo):$(context.pipelineRun.name)
        - name: pipeline-aggregate-status
          value: $(tasks.status)
        - name: pull-request-author
          value: $(tasks.test-metadata.results.pull-request-author)
        - name: pull-request-number
          value: $(tasks.test-metadata.results.pull-request-number)
        - name: git-repo
          value: $(tasks.test-metadata.results.git-repo)
        - name: git-org
          value: $(tasks.test-metadata.results.git-org)
        - name: git-revision
          value: $(tasks.test-metadata.results.git-revision)
        - name: junit-report-name
          value: e2e-report.xml
        - name: e2e-log-name
          value: e2e-tests.log
        - name: cluster-provision-log-name
          value: kind-aws-provision.log
        - name: enable-test-results-analysis
          value: "true"
        - name: artifact-browser-url
          value: $(params.artifact-browser-url)
